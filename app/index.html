<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pocket Scorecard</title>
<meta name="description" content="The scorecard for pitch & putt and golf. No account, no ads, works offline.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scorecard">
<style>
/* VOICE: calm and quiet, an Apple-style app that gets out of your way on the course
   IDEA: the iPhone's own apps (Fitness, Health, Settings): large titles, grouped rounded sections, segmented controls
   PICTURE: the scorecard as a clean white card with hairline rules; your entry below in a soft grey group
   COLOUR and TYPE: white page, iOS greys for groups, one mint accent, red only for birdie circles; the system font
   LAYOUT: large title header, grouped sections, translucent tab bar with icons */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#000000);--grp:light-dark(#f2f2f7,#1c1c1e);--cell:light-dark(#ffffff,#2c2c2e);
--ink:light-dark(#111114,#f5f5f7);--mute:light-dark(#8a8a8e,#8d8d93);--sep:light-dark(rgba(60,60,67,.16),rgba(84,84,88,.55));
--fill2:light-dark(rgba(118,118,128,.12),rgba(118,118,128,.24));--mint:light-dark(#1f9d74,#3cc893);--mintt:light-dark(rgba(31,157,116,.12),rgba(60,200,147,.18));
--red:light-dark(#e0283c,#ff5a6e);--on:#fff;
/* old names kept for inline styles */
--strong:var(--mint);--paper:var(--cell);--rule:var(--sep);--heavy:var(--sep);--fill:var(--mintt);--onfill:var(--ink);--hi:var(--mintt)}
:root[data-mode=light]{color-scheme:light}:root[data-mode=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:clip;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button,summary,[data-go],[data-act]{touch-action:manipulation}
img{-webkit-user-drag:none}
:root[data-big] body{zoom:1.15}
.band{padding:8px 16px}
.wrap{max-width:680px;margin:0 auto}
h2{font-size:22px;font-weight:700;margin:6px 0 10px;letter-spacing:-.01em}
h3{font-size:20px;font-weight:700;margin:18px 0 8px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute);font-size:15px}.msg{color:var(--mint);font-weight:600;min-height:1.4em;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
button{min-height:44px;border:0;border-radius:12px;background:var(--fill2);padding:0 16px;font-size:17px;font-weight:600;cursor:pointer;color:var(--ink)}
button:active{opacity:.6}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
input,textarea{border:0;border-radius:10px;background:var(--fill2);padding:10px 12px;min-height:44px;width:100%;font-size:17px}
input::placeholder,textarea::placeholder{color:var(--mute)}
.primary,.go{background:var(--mint);color:#fff}
.danger{color:var(--red);background:transparent}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}

/* header: large title */
.top{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding-top:env(safe-area-inset-top);transition:box-shadow .2s}
.top.compact{box-shadow:0 .5px 0 var(--sep)}.top.compact .bar{padding-top:8px;padding-bottom:8px;align-items:center}.top.compact .cname{font-size:17px;font-weight:600}.top.compact .csub{display:none}.top.compact .score b{font-size:20px}
.cname,.score b{transition:font-size .15s}
.more{min-height:32px;width:40px;padding:0;border-radius:999px;background:var(--fill2);color:var(--mint);font-size:18px;font-weight:700;line-height:1;letter-spacing:1px}
.bar{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 16px 6px}
.brand{display:flex;align-items:center;gap:10px}.fl{display:none}
.cname{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.02em}.csub{font-size:15px;color:var(--mute);margin-top:2px}
.csub:empty{display:none}
.score{display:flex;align-items:center;gap:8px}
.score b{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:15px;font-weight:700;color:var(--mint);background:var(--mintt);border-radius:999px;padding:3px 10px}

/* action sheet */
.sheetbg{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
.asheet{width:100%;max-width:520px;display:grid;gap:8px}
.asheet .grp{background:var(--cell);border-radius:14px;overflow:hidden}
.asheet .grp p{margin:0;padding:12px 16px;text-align:center;font-size:13px;color:var(--mute);border-bottom:.5px solid var(--sep)}
.asheet .grp button{display:block;width:100%;background:none;border-radius:0;min-height:56px;font-size:19px;font-weight:400;color:var(--mint);border-bottom:.5px solid var(--sep)}
.asheet .grp button:last-child{border-bottom:0}.asheet .grp button.danger{color:var(--red)}
.asheet .cancel{background:var(--cell);min-height:56px;border-radius:14px;font-size:19px;font-weight:600;color:var(--mint)}
@media(prefers-reduced-motion:no-preference){.asheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:4px 0 env(safe-area-inset-bottom)}
.tabs button{background:none;border-radius:0;min-height:52px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--mute);padding:0}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=true]{color:var(--mint)}

/* segmented controls */
.chips{display:inline-flex;flex-wrap:wrap;background:var(--fill2);border-radius:10px;padding:2px;gap:2px}
.chips button{min-height:34px;min-width:44px;border-radius:8px;background:transparent;font-size:15px;font-weight:600;padding:0 12px}
.chips button[aria-pressed=true]{background:var(--cell);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* grouped sections */
.hole,.list,.extras details,.welcome,.board,.panel,.blkgroup{background:var(--grp);border-radius:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:.5px solid var(--sep);flex-wrap:wrap}
.row:last-child{border-bottom:0}.row label{font-weight:600}

/* scorecard */
.sheetband{padding-top:4px}
.sheet{background:var(--cell);border-radius:14px;box-shadow:0 0 0 .5px var(--sep),0 2px 10px rgba(0,0,0,.05);overflow:hidden}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px}
.sheethead b{font-size:17px}.sheethead span{font-size:15px;color:var(--mute);white-space:nowrap}
.flip{min-height:32px;background:none;padding:0 2px;color:var(--mint);font-weight:600;font-size:15px}
.scroll{overflow-x:auto}
table.card{border-collapse:collapse;width:100%;min-width:560px;background:var(--cell);font-variant-numeric:tabular-nums;table-layout:fixed}
.card th,.card td{border:1px solid light-dark(#e3e3e8,#38383a);text-align:center;padding:0 2px;height:36px;font-size:15px;white-space:nowrap;overflow:hidden}
.card th:first-child,.card td:first-child{text-align:left;padding-left:12px;font-size:13px;font-weight:600;color:var(--mute)}
.card thead th{background:var(--mintt);font-weight:700;color:var(--ink)}
.card tr>*:first-child{border-left:0}.card tr>*:last-child{border-right:0}.card tbody tr:last-child>*{border-bottom:0}
.card .sub{font-weight:700}.card .yd{font-size:12px;color:var(--mute)}
.full tr>*{width:34px}.full tr>*:first-child{width:74px}.full .sub{width:44px}.full{min-width:770px}
tr.lite>*{height:26px!important;font-size:11px!important}.full tr.lite td,.nine tr.lite td{color:var(--mute)}.full tr.lite td:first-child,.nine tr.lite th{font-size:11px}
table.nine{min-width:0;table-layout:fixed}
.nine tr>*:first-child{width:54px}
.nine thead th{cursor:pointer}.nine td[data-go]{cursor:pointer}
.nine .cur{background:var(--mintt)}.nine thead .cur{background:var(--mint);color:#fff}
.nine .sub{width:40px}.nine .tt{width:40px}.nine tr.sc td{height:42px}
.mk{display:inline-grid;place-items:center;width:26px;height:26px;font-weight:600}
.b1,.b2{border:1.5px solid var(--red);border-radius:50%;color:var(--red)}.b2{outline:1.5px solid var(--red);outline-offset:2px}
.o1,.o2{border:1.5px solid currentColor;border-radius:3px}.o2{outline:1.5px solid currentColor;outline-offset:2px}
.nine .mk{width:24px;height:24px}.nine .b2,.nine .o2{width:20px;height:20px;outline-offset:1.5px}
.nine tr.pr th{color:var(--ink)}
@media(max-width:400px){.card th,.card td{font-size:13px;padding:5px 0}.nine tr>*:first-child{width:44px;padding-left:8px;font-size:12px}.nine .sub,.nine .tt{width:32px}.nine .mk{width:21px;height:21px}}

/* hole entry */
.play{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.hole{padding:4px 16px 14px;touch-action:pan-y}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:.5px solid var(--sep)}
.hbar>div{text-align:center;line-height:1.3}.hbar b{font-size:22px;font-weight:700}.hbar span{color:var(--mute);font-size:15px}.hbar small{display:block;color:var(--mute);font-size:13px}
.hbar>button{background:none;color:var(--mint);font-size:30px;font-weight:400;width:44px;padding:0}
.parbtn{min-height:30px;padding:0 12px;border-radius:999px;background:var(--mintt);color:var(--mint);font-size:15px;font-weight:700;margin:0 6px;vertical-align:2px}
.sval{display:flex;align-items:baseline;gap:8px}.sval b{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.sval small{color:var(--mute);font-weight:600;font-size:15px}
.sc3{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;width:100%}
.sc3 button{min-height:54px;font-size:22px;font-weight:700;background:var(--cell);box-shadow:0 .5px 2px rgba(0,0,0,.08)}
.sc3 button:nth-child(2){background:var(--mint);color:#fff;font-size:18px}
.step{display:flex;align-items:center;gap:0;width:100%}.step span{margin-right:auto;font-weight:600}
.step button{width:46px;min-height:34px;padding:0;font-size:22px;font-weight:400;border-radius:0;background:var(--fill2)}
.step button:first-of-type{border-radius:9px 0 0 9px;border-right:.5px solid var(--sep)}.step button:last-of-type{border-radius:0 9px 9px 0}
.step output{width:34px;text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.tip{margin-top:12px;background:var(--mintt);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.tip b{font-weight:700}.tip button{justify-self:start;min-height:34px;margin-top:4px;background:var(--cell)}
.next{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:10px;padding:10px max(16px,calc(50% - 324px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.next .go{flex:1;min-height:50px;font-size:17px}.playpad{height:76px}
.tipme{background:var(--mintt);color:var(--mint);min-height:50px}

/* partners */
.partners{display:grid;gap:0}
.psheet{border-radius:14px 14px 0 0}
.pentry{background:var(--grp);border-radius:0 0 14px 14px;padding:4px 16px 8px}
.pehead{font-size:13px;color:var(--mute);font-weight:600;padding:8px 0 2px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 50px 58px 50px;align-items:center;gap:6px;padding:8px 0;border-bottom:.5px solid var(--sep)}
.prow:last-child{border-bottom:0}
.prow .pn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow b{font-size:22px;font-weight:700;min-width:24px;text-align:right}.prow small{color:var(--mute);font-size:13px;min-width:46px}
.prow button{min-height:42px;padding:0;font-weight:700;background:var(--cell);box-shadow:0 .5px 2px rgba(0,0,0,.08)}
.prow button:nth-of-type(2){background:var(--mintt);color:var(--mint);box-shadow:none}

/* folded extras */
.extras{display:grid;gap:10px}
.extras summary{list-style:none;cursor:pointer;display:flex;align-items:center;min-height:50px;padding:0 16px;font-weight:600}
.extras summary::-webkit-details-marker{display:none}
.extras summary::after{content:"›";font-size:22px;color:var(--mute);margin-left:10px;transition:transform .2s}.extras details[open] summary::after{transform:rotate(90deg)}
.extras summary span{margin-left:auto;color:var(--mute);font-weight:500;font-size:15px}
.extras .stats{margin:0 16px 8px;background:none}.extras .panel{padding:0 16px 14px;background:none}
.finder{display:flex;gap:10px;align-items:center}.finder input{width:110px}
#pick{font-size:22px;font-weight:700;margin-top:10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;background:var(--grp);border-radius:14px;padding:0 16px}
.stat{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 0;border-bottom:.5px solid var(--sep)}
.stat .num{font-size:17px;font-weight:700;white-space:nowrap}.stat small{color:var(--mute);font-size:15px}
.big-score{font-size:52px;font-weight:700;margin:0;line-height:1.05;letter-spacing:-.02em}.big-score span{color:var(--mint);font-size:28px}
.board{padding:2px 16px;margin:14px 0}.board div{display:grid;grid-template-columns:24px minmax(0,1fr) auto 46px;align-items:baseline;gap:8px;padding:12px 0;border-bottom:.5px solid var(--sep)}
.board div:last-child{border-bottom:0}.board span{color:var(--mute);font-weight:600}.board em{font-style:normal;font-size:22px;font-weight:700}.board small{text-align:right;font-weight:700;color:var(--mint)}
.spark{display:flex;align-items:flex-end;gap:8px;height:80px;padding:6px 16px;background:var(--grp);border-radius:14px}.spark div{flex:1;display:grid;justify-items:center;gap:3px}
.spark i{display:block;width:100%;max-width:22px;background:color-mix(in srgb,var(--mute) 45%,transparent);border-radius:4px 4px 2px 2px}.spark i.u{background:var(--mint)}.spark small{font-size:11px;color:var(--mute)}
.hard{display:flex;gap:10px}.hard div{flex:1;background:var(--grp);border-radius:14px;padding:10px 14px}.hard b{display:block;font-size:22px}.hard small{color:var(--mute)}

/* lists */
.list{padding:0 16px}
.item{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:.5px solid var(--sep)}
.item:last-child{border-bottom:0}
.item .num{font-size:24px;font-weight:700;width:44px}.item .grow{flex:1 1 170px}.item small{color:var(--mute);font-size:14px}
.item button{min-height:36px;font-size:15px;padding:0 12px}
.ritem{width:100%;background:none;border-radius:0;text-align:left;font-weight:400;min-height:0;padding:10px 0}.ritem b{font-weight:600}.ritem .tp{font-weight:700;color:var(--mint)}.ritem:active{opacity:.5}
.pb{color:var(--mint);background:var(--mintt);font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;vertical-align:2px}

/* home */
.home{max-width:560px}
.welcome{background:var(--mintt);padding:14px 16px;margin-bottom:16px}.welcome ul{margin:8px 0 12px;padding-left:18px}.welcome li{margin-bottom:6px;font-size:15px}
.hero{position:relative;background:linear-gradient(160deg,var(--mint),color-mix(in srgb,var(--mint) 70%,#0b3d2c));color:#fff;border-radius:20px;padding:18px 18px 16px;box-shadow:0 8px 24px -12px color-mix(in srgb,var(--mint) 70%,transparent)}
.hero .flag{position:absolute;right:18px;top:16px;width:28px;height:40px;color:#fff;opacity:.9}
.hero>small{font-size:13px;opacity:.85;font-weight:600}
.hname{font-size:28px;font-weight:700;line-height:1.1;margin:2px 44px 4px 0;letter-spacing:-.01em}
.hmeta{font-size:15px;opacity:.85}
.hnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0;padding-top:12px;border-top:.5px solid rgba(255,255,255,.35)}
.hnums b{display:block;font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.hnums small{font-size:12px;opacity:.85}
.hgo{width:100%;min-height:50px;border-radius:12px;background:#fff;color:var(--mint);font-weight:700}
.heroopt{display:flex;justify-content:flex-end;margin-top:8px}
.s10{min-height:34px;font-size:15px;border-radius:999px;padding:0 14px}.s10[aria-pressed=true]{background:var(--mint);color:#fff}
.party{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 4px}.party>.muted{font-size:15px}
.party input{width:130px;min-height:36px;padding:6px 12px}.party>button{min-height:36px;font-size:15px}
.pchip{display:inline-flex;align-items:center;gap:0;background:var(--mintt);color:var(--mint);border-radius:999px;padding:0 0 0 12px;font-weight:600;font-size:15px}
.pchip button{background:none;min-height:34px;width:32px;padding:0;font-size:17px;color:var(--mint)}
.addp{background:none;color:var(--mint)}
.crow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.crow button{flex:none;display:grid;text-align:left;padding:10px 14px;background:var(--grp);border-radius:14px;min-height:58px}.crow small{color:var(--mute);font-size:13px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;min-height:84px;padding:12px 14px;border-radius:16px;background:var(--grp)}
.tile b{font-size:22px;font-weight:700}.tile span{font-weight:600;display:grid;font-size:15px}.tile small{font-weight:500;color:var(--mute);font-size:13px}
.tile[aria-pressed=true]{background:var(--mint);color:#fff}.tile[aria-pressed=true] small{color:rgba(255,255,255,.85)}
.pickrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:12px}.pickrow input{grid-column:1/-1}
.go18{min-height:50px}.go9{min-height:50px}.pickrow .s10{grid-column:1/-1;justify-self:start}
.addc{width:100%;margin-top:10px;background:none;color:var(--mint);font-weight:600}

/* range */
.blk{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--grp);border-radius:14px;margin-top:10px}
.blk>button{flex:none;width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;font-size:15px;background:var(--cell);box-shadow:inset 0 0 0 1.5px var(--sep);color:transparent}
.blk>button[aria-pressed=true]{background:var(--mint);color:#fff;box-shadow:none}
.blk b{display:block}.blk .balls{color:var(--mint);font-weight:700;white-space:nowrap;font-size:15px}.blk.done .txt{opacity:.45}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}.steps li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.bn{flex:none;min-width:32px;text-align:center;font-weight:700;font-size:13px;background:var(--mintt);color:var(--mint);border-radius:6px;padding:1px 4px;font-variant-numeric:tabular-nums}

/* courses + settings */
.photo{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
.photo img{display:block;width:100%;max-height:36vh;object-fit:contain;border-radius:12px;background:#000;cursor:zoom-in}
.photo.zoom img{max-height:85vh;cursor:zoom-out}
table.grid{border-collapse:collapse;width:100%;background:var(--grp);border-radius:14px;overflow:hidden}
.grid th{font-size:13px;color:var(--mute);font-weight:600;text-align:left;padding:10px 8px;border-bottom:.5px solid var(--sep)}
.grid td{padding:5px 8px;border-bottom:.5px solid var(--sep)}.grid tr:last-child td{border-bottom:0}
.grid td:first-child{font-weight:700;width:40px}

}
function csv(){
  const q=v=>{v=v==null?"":String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},rows=[["round_id","date","course","mode","player","hole","par","yards","index","strokes","putts","tee","penalties","thin"]];
  for(const r of D.rounds){if(r.legacy){rows.push([r.id,r.date,r.courseName,r.mode,"You","total",r.par,"","",r.score,r.putts??"","","",""]);continue}
    r.holes.forEach((h,i)=>{if(!h.done)return;rows.push([r.id,r.date,r.courseName,r.mode,"You",i+1,h.par,h.yds??"",h.idx??"",h.strokes,h.putts,h.fw==="hit"?"fairway":h.fw,h.pen,h.thin]);pnames(r).forEach((nm,j)=>rows.push([r.id,r.date,r.courseName,r.mode,nm,i+1,h.par,h.yds??"",h.idx??"",(h.ps||[])[j]??"","","","",""]))})}
  return rows.map(x=>x.map(q).join(",")).join("\n");
}
function sumText(r){const s=stats(r),pl=r.holes.filter(h=>h.done);return`${r.courseName} · ${r.date}\n`+(r.note?r.note+"\n":"")+pnames(r).map((nm,j)=>{const t=pl.reduce((a,h)=>a+((h.ps||[])[j]||0),0);return`${nm}: ${t} (${vp(t-s.par)})\n`}).join("")+`Score ${s.score} (${vp(s.score-s.par)}) over ${s.played} holes\nPutts ${s.putts} · 3-putts ${s.three} · Greens ${s.gir}/${s.played}`+(r.mode!=="pp"?` · Fairways ${s.fir}/${s.firN}`:"")+(s.pts!=null?` · ${s.pts} Stableford pts`:"")+`\nPenalties ${s.pen} · Thin shots ${s.thin}`+(s.n===18&&s.bkN?`\nOut ${s.front} · In ${s.back}`:"")}
function restore(text){
  try{const o=JSON.parse(text);if(o.v!==2||!Array.isArray(o.rounds)||!Array.isArray(o.courses))throw 0;D=o;save();ui={msg:"Backup restored."};view="data";render()}
  catch(e){ui.confirm=null;setMsg("That doesn't look like a Pocket Scorecard backup.");render()}
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-tab],[data-go]");if(!b)return;
  if(b.dataset.tab){ui={};backTo=null;navDir="tab";view=b.dataset.tab==="play"?(D.active?"play":"start"):b.dataset.tab;render();window.scrollTo(0,0);return}
  const a=b.dataset.act,r=D.active,h=r&&r.holes[r.cur];
  if(b.dataset.go!=null){r.cur=+b.dataset.go;ui.tip=null;save();render();return}
  switch(a){
    case"back":goBack();return;
    case"start":startRound(b.dataset.kind,b.dataset.id);break;
    case"set":{buzz();const k=b.dataset.k,v=b.dataset.v;
      if(k==="par"){const o=h.par;h.par=+v;if(!h.done&&h.strokes===o)h.strokes=h.par;if(h.par<4)h.fw="";else if(!h.fw&&!h.done)h.fw="hit"}
      else if(k==="strokes"){h.strokes=+v;h.putts=Math.min(h.putts,h.strokes)}
      else if(k==="putts"){h.putts=Math.min(+v,h.strokes)}
      else if(k==="fw")h.fw=h.fw===v?"":v;
      save();break}
    case"sadj":buzz();h.strokes=Math.max(1,Math.min(20,h.strokes+ +b.dataset.d));h.putts=Math.min(h.putts,h.strokes);save();break;
    case"pcycle":{const o=h.par;h.par=o===5?3:o+1;if(!h.done&&h.strokes===o)h.strokes=h.par;if(h.ps&&!h.done)h.ps=h.ps.map(v=>v===o?h.par:v);h.putts=Math.min(h.putts,h.strokes);if(h.par<4)h.fw="";else if(!h.fw&&!h.done)h.fw="hit";buzz();save();break}
    case"padj":buzz();h.ps[+b.dataset.p]=Math.max(1,Math.min(20,h.ps[+b.dataset.p]+ +b.dataset.d));save();break;
    case"ppar":buzz();h.ps[+b.dataset.p]=h.par;save();break;
    case"s10":ui.s10=!ui.s10;break;
    case"addp":{const i=$("pName"),v=(i&&i.value||"").trim().slice(0,14);if(v&&(D.party||[]).length<3){D.party=[...(D.party||[]),v];save()}ui.adding=!v;break}
    case"showadd":if(needPro("partners"))return;ui.adding=true;render();setTimeout(()=>{const i=$("pName");i&&i.focus()},0);return;
    case"rmp":D.party=(D.party||[]).filter((_,i)=>i!==+b.dataset.i);save();break;
    case"seen":D.seen=true;save();break;
    case"pwclose":ui.paywall=null;ui.msg="";break;
    case"buypro":buyPro();return;
    case"restorepro":restorePro();return;
    case"gopro":ui.paywall="pro";break;
    case"units":D.units=b.dataset.v;save();break;
    case"big":D.big=b.dataset.v==="1";save();break;
    case"goclubs":ui={};view="data";render();setTimeout(()=>{const c=$("clubs");c&&c.scrollIntoView()},0);return;
    case"editround":{if(D.active){setMsg("Finish or discard your round in progress first.");return}const r2=D.rounds.find(x=>x.id===ui.viewRound);if(!r2)return;
      D.rounds=D.rounds.filter(x=>x!==r2);r2.cur=r2.start||0;delete r2.done;D.active=r2;ui={};view="play";save();break}
    case"spar":buzz();h.strokes=h.par;h.putts=Math.min(h.putts,h.strokes);save();break;
    case"step":buzz();h[b.dataset.k]=Math.max(0,Math.min(10,h[b.dataset.k]+ +b.dataset.d));save();break;
    case"done":{const fin=isLast(r);if(!fin)snap(`Hole ${r.cur+1} saved`);buzz(fin?"HEAVY":"LIGHT");h.done=true;ui.tip=null;if(fin){finish();break}r.cur=nextI(r);save();break}
    case"prev":r.cur=(r.cur-1+r.holes.length)%r.holes.length;ui.tip=null;save();break;
    case"fwd":r.cur=nextI(r);ui.tip=null;save();break;
    case"tip":tipMe();break;
    case"pick":ui.pick=ui.pick===b.dataset.v?null:b.dataset.v;break;
    case"range":if(needPro("range"))return;ui={};view="range";break;
    case"balls":ui.balls=+b.dataset.v;ui.custom=false;ui.rd={};break;
    case"bcustom":ui.custom=true;break;
    case"rdone":ui.rd[b.dataset.v]=!ui.rd[b.dataset.v];break;
    case"mode":D.mode=b.dataset.v;save();break;
    case"pal":D.pal=b.dataset.v;save();break;
    case"menu":ui.menu="main";break;
    case"menuclose":ui.menu=null;break;
    case"menudisc":ui.menu="discard";break;
    case"noop":return;
    case"ctpl":snap("Clubs filled in");D.clubs=CTPL[b.dataset.v].map(c=>[...c]);save();break;
    case"dojsonnow":D.lastBackup=Date.now();save();if(native)dl("pocket-scorecard-backup.json",JSON.stringify(D),"application/json");else{ui={};view="data";render();setTimeout(()=>{const c=document.querySelector('[data-act="dljson"]');c&&c.scrollIntoView({block:"center"})},0);return}break;
    case"snooze":D.backupSnooze=Date.now()+7*864e5;save();break;
    case"shareimg":if(needPro("image"))return;shareImage();return;
    case"imgclose":ui.img=null;break;
    case"hmode":ui.hm=b.dataset.v;render();filterHist();return;
    case"undo":{const u=ui.undo;if(!u)return;D=JSON.parse(u.d);view=u.view;ui={};clearTimeout(undoT);save();buzz();break}
    case"tipclose":ui.tip=null;break;
    case"ask":ui.confirm=b.dataset.c;break;
    case"noconf":ui.confirm=null;break;
    case"finish":finish();break;
    case"discard":snap("Round discarded");D.active=null;{const u=ui.undo;ui={undo:u}}view="start";save();break;
    case"delround":snap("Round deleted");D.rounds=D.rounds.filter(x=>"del:"+x.id!==ui.confirm);ui.confirm=null;save();break;
    case"view":ui={viewRound:b.dataset.id};view="summary";break;
    case"copysum":{const t=sumText(D.rounds.find(x=>x.id===ui.viewRound));if(Share){Share.share({text:t}).catch(()=>{})}else copy(t,"Summary");return}
    case"newc":if(D.courses.length>=2&&needPro("courses"))return;ui={edit:{id:uid("c"),name:"",mode:"pp",photo:null,holes:Array.from({length:18},()=>({par:null,yds:null,idx:null}))}};view="edit";break;
    case"editc":{const c=JSON.parse(JSON.stringify(D.courses.find(x=>x.id===b.dataset.id)));c.holes.forEach(h=>{if(h.pa)h.par=null;delete h.pa});ui={edit:c}}view="edit";break;
    case"cmode":ui.edit.mode=b.dataset.v;break;
    case"choles":{const n=+b.dataset.v,hs=ui.edit.holes;ui.edit.holes=n<hs.length?hs.slice(0,n):hs.concat(Array.from({length:n-hs.length},()=>({par:null,yds:null,idx:null})));break}
    case"call":ui.edit.holes.forEach(x=>x.par=b.dataset.v?+b.dataset.v:null);break;
    case"cpar":{const i=+b.dataset.i,x=ui.edit.holes[i];x.par=x.par==null?3:x.par===5?null:x.par+1;b.textContent=x.par??"–";$("as"+i).textContent=asTxt(x);$("ctot").textContent=totTxt(ui.edit);return}
    case"zoom":ui.zoom=!ui.zoom;break;
    case"cam":Camera.getPhoto({quality:70,resultType:"dataUrl",source:"PROMPT",width:1400,correctOrientation:true}).then(p=>setPhoto(p.dataUrl)).catch(()=>{});return;
    case"rmphoto":ui.edit.photo=null;break;
    case"savec":{const c=ui.edit;if(!c.name.trim()){setMsg("Give the course a name first.");return}
      c.holes.forEach(h=>{if(h.par==null){h.par=assume(h,c.mode);h.pa=true}else h.pa=false});const i=D.courses.findIndex(x=>x.id===c.id);if(i>=0)D.courses[i]=c;else D.courses.push(c);
      let m="";if(!save()){c.photo=null;save();m="Phone storage is full, so the photo wasn't kept. The course is saved."}
      ui={msg:m};view="courses";break}
    case"delc":snap("Course deleted");D.courses=D.courses.filter(x=>x.id!==ui.edit.id);{const u=ui.undo;ui={undo:u}}view="courses";save();break;
    case"dlcsv":dl("golf-rounds.csv",csv(),"text/csv");return;
    case"copycsv":copy(csv(),"CSV");return;
    case"dljson":D.lastBackup=Date.now();save();dl("pocket-scorecard-backup.json",JSON.stringify(D),"application/json");return;
    case"copyjson":D.lastBackup=Date.now();save();copy(JSON.stringify(D),"Backup");return;
    case"askrestore":if(!$("paste").value.trim()){setMsg("Paste a backup first.");return}ui.pasted=$("paste").value;ui.confirm="restore";break;
    case"restore":restore(ui.pasted||"");return;
  }
  render();
});
document.addEventListener("toggle",e=>{const t=e.target;if(t&&t.id&&t.tagName==="DETAILS")ui["o_"+t.id]=t.open},true);
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="yds"){const c=club(uy(parseInt(t.value,10)));$("pick").textContent=c?c[0]:"Enter a distance";$("pnote").textContent=c?c[1]:"Uses your own carry distances.";return}
  if(t.id==="rnote"){const r=D.rounds.find(x=>x.id===ui.viewRound);if(r){r.note=t.value.slice(0,500);save()}return}
  if(t.id==="hq"){ui.hq=t.value;filterHist();return}
  if(t.id==="hcpIn"){const v=parseInt(t.value,10);D.hcp=v>=0&&v<=54?v:null;save();return}
  if(t.dataset.club!=null){const v=parseInt(t.value,10),nm=t.dataset.club;D.clubs=(D.clubs||[]).filter(c=>c[0]!==nm);if(v>0)D.clubs.push([nm,uy(v)]);D.clubs.sort((a,b)=>BAG.indexOf(a[0])-BAG.indexOf(b[0]));save();return}
  if(t.dataset.addp!=null)return;
  if(t.dataset.f==="name"){ui.edit.name=t.value;return}
  if(t.dataset.g){const i=+t.dataset.i,v=parseInt(t.value,10),h=ui.edit.holes[i];h[t.dataset.g]=v>0?(t.dataset.g==="yds"?uy(v):v):null;$("as"+i).textContent=asTxt(h);$("ctot").textContent=totTxt(ui.edit)}
});
document.addEventListener("change",e=>{
  const t=e.target;if(t.id==="ballsIn"){const v=parseInt(t.value,10);if(v>=10&&v<=300){ui.balls=v;ui.custom=true;ui.rd={};render()}return}
  const f=t.files&&t.files[0];if(!f)return;
  if(t.id==="photoIn"){const fr=new FileReader();fr.onload=()=>setPhoto(fr.result);fr.readAsDataURL(f)}
  if(t.id==="restoreIn"){f.text().then(x=>{ui.pasted=x;ui.confirm="restore";render();setMsg("Backup loaded. Confirm to restore.")})}
});
let sx=null,sy=null,ex=null,ey=null,eOn=false;
document.addEventListener("touchstart",e=>{const t=e.touches[0];ex=null;if(DETAIL[view]&&t.clientX<28&&!document.querySelector(".sheetbg")){ex=t.clientX;ey=t.clientY;eOn=false}},{passive:true});
document.addEventListener("touchmove",e=>{if(ex==null)return;const t=e.touches[0],dx=t.clientX-ex,dy=t.clientY-ey;
  if(!eOn){if(Math.abs(dy)>12&&Math.abs(dy)>dx){ex=null;return}if(dx>10){eOn=true;$("app").classList.add("drag")}else return}
  const a=$("app"),w=innerWidth,d=Math.max(0,dx);a.style.transform=`translateX(${d}px)`;a.style.opacity=String(1-d/w*.35)},{passive:true});
document.addEventListener("touchend",e=>{if(ex==null)return;const a=$("app"),dx=e.changedTouches[0].clientX-ex,was=eOn;ex=null;eOn=false;if(!was)return;
  a.classList.remove("drag");a.classList.add("settle");
  if(dx>Math.min(110,innerWidth*.3)){a.style.transform=`translateX(${innerWidth}px)`;a.style.opacity="0";setTimeout(()=>{a.classList.remove("settle");a.style.transform="";a.style.opacity="";goBack()},200)}
  else{a.style.transform="";a.style.opacity="";setTimeout(()=>a.classList.remove("settle"),240)}},{passive:true});
document.addEventListener("touchstart",e=>{if(e.target.closest("#holeCard")){sx=e.touches[0].clientX;sy=e.touches[0].clientY}else sx=null},{passive:true});
document.addEventListener("touchend",e=>{if(sx==null||!D.active)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>70&&Math.abs(dy)<50){const r=D.active;r.cur=Math.max(0,Math.min(r.holes.length-1,r.cur+(dx<0?1:-1)));ui.tip=null;save();render()}},{passive:true});
document.addEventListener("keydown",e=>{if(e.target.id==="pName"&&e.key==="Enter"){document.querySelector('[data-act="addp"]').click();return}if(view!=="play"||/INPUT|TEXTAREA/.test(e.target.tagName))return;const b=document.querySelector(`[data-act="${e.key==="ArrowLeft"?"prev":e.key==="ArrowRight"?"fwd":""}"]`);if(b)b.click()});
window.addEventListener("scroll",()=>{const t=document.querySelector(".top");if(!t)return;const y=window.scrollY,c=t.classList.contains("compact");if(!c&&y>48)t.classList.add("compact");else if(c&&y<6)t.classList.remove("compact")},{passive:true});
{const sp=$("splash");if(sp){const go=()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),400)};sp.addEventListener("click",go);setTimeout(go,window.__seenIntro?1200:1750)}}
render();
if(FS&&!hadLocal)FS.readFile({path:"pocket-scorecard.json",directory:"DATA",encoding:"utf8"}).then(r=>{const o=JSON.parse(r.data);if(o&&o.v===2){D=o;save();render()}}).catch(()=>{});
if(!native&&location.protocol==="https:"&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
